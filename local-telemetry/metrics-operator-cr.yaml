# Metrics-operator configuration: which ODG resources to count and where to push.
# Used by: telemetry.sh up   (kubectl apply -f this file)
#
# Applied into odg-system — same namespace as the e2e-installed metrics-operator and
# otel-collector. DataSink targets the e2e collector's in-cluster service; the
# collector exports to Prometheus via the prometheus exporter on :8889, plus
# opensearch for logs (exporter added via the ProviderConfig helmValuesFrom merge).
apiVersion: metrics.open-control-plane.io/v1alpha1
kind: DataSink
metadata:
  name: default
  namespace: odg-system
spec:
  connection:
    endpoint: "grpc://otel-collector.odg-system.svc.cluster.local:4317"
---
apiVersion: metrics.open-control-plane.io/v1alpha1
kind: Metric
metadata:
  name: odg-pods-running
  namespace: odg-system
spec:
  name: odg_pods_running
  description: Count of Running pods in odg-system
  interval: 1m
  target:
    group: ""
    version: v1
    kind: Pod
  dataSinkRef:
    name: default
  fieldSelector: "status.phase=Running"
  projections:
    - name: pod
      fieldPath: metadata.name
